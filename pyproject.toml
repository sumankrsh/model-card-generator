[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "model-card-generator"
version = "0.1.0"
description = "Audit-ready model cards and model-risk summaries, computed from your predictions file, with a CI check for missing sections."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suman Mukherjee" }]
requires-python = ">=3.11"
keywords = ["model-cards", "model-risk", "fairness", "documentation", "sr-11-7", "eu-ai-act"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
model-card = "model_card_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_card_generator"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: Typer declares options as argument defaults.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
